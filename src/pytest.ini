[pytest]
# Pytest configuration for TFG project

# Add current directory to Python path so imports work
pythonpath = .

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directory - only look in backend/tests
testpaths = backend/tests

# Exclude vendor, node_modules, and other non-test directories
norecursedirs = vendor node_modules .git __pycache__ ios android frontend/vendor frontend/node_modules frontend/ios scripts

# Output options
addopts = -v --tb=short
