[pytest]
# Pytest configuration for TFG project

# Add src to Python path so imports work
pythonpath = .

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directory
testpaths = tests

# Exclude vendor and other non-test directories
norecursedirs = vendor node_modules .git __pycache__ ios android

