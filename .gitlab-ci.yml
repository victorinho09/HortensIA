stages:
  - test

pytest:
  stage: test
  image: python:3.12-slim
  before_script:
    - python -V
    - python -m pip install --upgrade pip
    - if [ -f backend/requirements.txt ]; then python -m pip install -r backend/requirements.txt; fi
  script:
    - python -m pytest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"